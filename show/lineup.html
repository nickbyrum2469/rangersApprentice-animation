<!doctype html><html><head><meta charset="utf-8"><title>Cast lineup</title>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { makeCharacter, DESIGNS } from './lib/cast.js';
import { EXPR } from './lib/character.js';
const q = new URLSearchParams(location.search);
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe0e8');
scene.add(new THREE.HemisphereLight('#fff6e6', '#6a7a5a', 1.4));
const sun = new THREE.DirectionalLight('#fff1d8', 2.2);
sun.position.set(4, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 6, bottom: -2 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshToonMaterial({ color: '#a8b88a' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const ids = (q.get('ids') || 'halt,will,horace,alyss,jenny,george,baron,rodney,pauline,chubb,nigel,morgarath').split(',');
const exprs = ['determined', 'curious', 'smirk', 'neutral', 'happy', 'worried', 'grin', 'stern', 'neutral', 'angry', 'neutral', 'menace'];
const sp = 0.95;
ids.forEach((id, i) => {
  const c = makeCharacter(id);
  const x = (i - (ids.length - 1) / 2) * sp;
  c.apply({ pos: [x, 0, (i % 2) * -0.6], yaw: -x * 0.04, expr: EXPR[exprs[i % exprs.length]], hood: id === 'halt' ? +(q.get('hood') || 0) : 0, t: 1,
    armL: { out: 0.15, bend: 0.25 }, armR: { out: 0.15, bend: 0.25 }, look: [0, -0.1] });
  scene.add(c.root);
});
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 30), W / H, 0.1, 100);
cam.position.set(+(q.get('cx') || 0), +(q.get('cy') || 1.4), +(q.get('cz') || 12.5));
cam.lookAt(+(q.get('tx') || 0), +(q.get('ty') || 0.95), 0);
r.render(scene, cam);
window.done = true;
</script></body></html>
